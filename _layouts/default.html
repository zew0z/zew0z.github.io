<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d2021">
  {% seo %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <noscript><style>.boot { display: none; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main">skip to content</a>

  <header class="titlebar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-prompt">z@zew0z.github.io</span><span class="caret" aria-hidden="true"></span>
    </a>
    <nav class="titlebar-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}#terminal">terminal/</a>
      <a href="{{ '/' | relative_url }}#writeups">writeups/</a>
      <a href="{{ '/' | relative_url }}#about">about/</a>
      <a href="{{ '/' | relative_url }}#contact">contact/</a>
    </nav>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="tmuxbar" role="contentinfo">
    <div class="tmuxbar-left">
      <span class="tmux-session">[z@blog]</span>
      <a class="tmux-win tmux-win-active" data-section="home" href="{{ '/' | relative_url }}">0:home</a>
      <a class="tmux-win" data-section="writeups" href="{{ '/' | relative_url }}#writeups">1:writeups</a>
      <a class="tmux-win" data-section="terminal" href="{{ '/' | relative_url }}#terminal">2:terminal</a>
      <a class="tmux-win" data-section="about" href="{{ '/' | relative_url }}#about">3:about</a>
      <a class="tmux-win" data-section="contact" href="{{ '/' | relative_url }}#contact">4:contact</a>
      <a class="tmux-win" href="https://ko-fi.com/zew0z" target="_blank" rel="noopener">5:support</a>
    </div>
    <div class="tmuxbar-right">
      <span class="tmux-clock" id="tmux-clock" aria-hidden="true"></span>
    </div>
  </footer>

  <div class="crt" aria-hidden="true"></div>

  <div class="boot" id="boot" data-posts="{{ site.posts | size }}" aria-hidden="true">
    <pre class="boot-text" id="boot-text"></pre>
    <span class="boot-hint">press any key to skip</span>
  </div>

  {% assign asset_v = site.time | date: '%Y%m%d%H%M%S' %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ asset_v }}" defer></script>
  {% if page.url == '/' %}<script src="{{ '/assets/js/terminal.js' | relative_url }}?v={{ asset_v }}" defer></script>{% endif %}
</body>
</html>
